[metadata]
example_data = true
description = "Illustrative coupled cycle/exchanger problem; not validated hardware"

[problem]
simulation_configuration = "harmonic_controlled_example.toml"
cold_exchanger_configuration = "exchanger_screening_example.toml"
hot_exchanger_configuration = "exchanger_screening_example.toml"

[objectives]
cold = "minimum_gas_volume"
hot = "minimum_gas_volume"

[hydraulic_partition]
# Explicit fractions of distributed core length/loss assigned before the
# lumped exchanger control volume. The remainder is assigned after it.
cold_inlet_core_fraction = 0.5
hot_inlet_core_fraction = 0.5
cold_inlet_collector_loss_coefficient = 0.0
cold_outlet_collector_loss_coefficient = 0.0
hot_inlet_collector_loss_coefficient = 0.0
hot_outlet_collector_loss_coefficient = 0.0

[coupling]
maximum_iterations = 6
relative_tolerance = 1.0e-3
flow_under_relaxation = 0.5
hydraulic_continuation_steps = 2
exchanger_maximum_iterations = 100
exchanger_function_tolerance = 1.0e-9
