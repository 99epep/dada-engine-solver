[metadata]
example_data = true
description = "Exploratory cooling-cell exchanger search; transport and external conductance require validation"

[working_gas]
gas_constant = 287.0
heat_capacity_cp = 1004.5
heat_capacity_cv = 717.5

[transport]
dynamic_viscosity = 1.7e-5
thermal_conductivity = 0.024

[operating_point]
absolute_mass_flow_rate = 0.0752
pressure = 8.78e4
temperature = 270.0

[thermal_resistances]
wall_thickness = 5.0e-4
wall_thermal_conductivity = 200.0
external_conductance = 500.0
additional_resistance = 0.0

[requirements]
minimum_overall_conductance = 125.0
maximum_pressure_drop = 5000.0
maximum_mach_number = 0.3
# The former 0.66 L cycle value produced no feasible seed at 125 W/K in this
# illustrative model. The expanded 2 L bound is exploratory, not validated.
maximum_gas_volume = 2.0e-3
maximum_pressure_drop_fraction = 0.05

[parallel_channel_grid]
channel_counts = [100, 200, 400, 800]
channel_widths = [0.01, 0.02, 0.04]
channel_heights = [0.001, 0.002, 0.004]
channel_lengths = [0.05, 0.10, 0.20, 0.40]
surface_roughness = 0.0
minor_loss_coefficient = 0.0
