# Small machinery smoke campaign, not a final optimization or optimal waveform.
[campaign]
base_configuration = "motor_demonstrator_original_325c.toml"
maximum_candidates = 2
elite_size = 5
initial_evaluation_seconds = 10.0

[numerical]
# Smoke-runtime cap only. Periodic tolerances are unchanged; non-convergence
# remains a rejection, never a provisional feasible result.
maximum_cycles = 3

[families]
kinematics = "free"
exchanger = "reservoir"

[search]
type = "sobol"
seed = 27
scramble = true

[free]
# Four chart coordinates per cylinder; only two per side vary in this smoke.
# Smooth independent smoke laws; no preferred waveform is imposed by the family.
small_coordinates = [-1.0644882096517823, -0.8982360410339347, 0.1671444199266457, 1.165225598617315]
large_coordinates = [0.16987674043167245, 0.45769911514731726, 0.42766998136995604, 0.15220593602063506]

[objective]
type = "maximize_thermal_efficiency"

[[constraints]]
type = "minimum_motor_power"
required_power = 1.0

[[constraints]]
type = "maximum_pressure"
limit = 600000.0

[[constraints]]
type = "maximum_temperature"
limit = 850.0

