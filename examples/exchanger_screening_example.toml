[metadata]
example_data = true
description = "Illustrative exchanger grid; inputs are not validated DADA hardware data"

[working_gas]
gas_constant = 287.0
heat_capacity_cp = 1004.5
heat_capacity_cv = 717.5

[transport]
# Illustrative constant values that must be replaced by sourced properties at
# the actual mean pressure and temperature.
dynamic_viscosity = 1.8e-5
thermal_conductivity = 0.026

[operating_point]
# Illustrative mean-state screening point, not a complete pulsatile envelope.
absolute_mass_flow_rate = 0.01
pressure = 1.0e5
temperature = 285.0

[thermal_resistances]
wall_thickness = 5.0e-4
wall_thermal_conductivity = 200.0
# Reservoir-side h*A, supplied independently of the gas-side geometry.
external_conductance = 200.0
additional_resistance = 0.0

[requirements]
minimum_overall_conductance = 20.0
maximum_pressure_drop = 5000.0
maximum_mach_number = 0.3
maximum_gas_volume = 6.6e-4
maximum_pressure_drop_fraction = 0.05
minimum_effectiveness = 0.5

[parallel_channel_grid]
channel_counts = [20, 40, 80]
channel_widths = [0.01, 0.02]
channel_heights = [0.001, 0.002, 0.004]
channel_lengths = [0.05, 0.10, 0.20]
surface_roughness = 0.0
# The user must supply manifold, entrance, exit and bend losses.
minor_loss_coefficient = 0.0
