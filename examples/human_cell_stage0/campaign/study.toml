[policies]
volume_partition = "total_swept_and_clearance_ratios"
charge = "explicit_inventory"
outlet_valve_cda = "fixed_source_cda"
mechanical_losses = "unknown"
useful_power = "unavailable"
local_reflux = "retain_signed_flows"
external_loop_hydraulics = "unmodelled"
external_pump_fan_consumption = "excluded_from_balance"

[objective]
type = "maximize_cooling_cop"
unit = "1"

[[constraints]]
type = "maximum_pressure"
limit = 1200000.0
unit = "Pa"

[[constraints]]
type = "maximum_temperature"
limit = 850.0
unit = "K"

[[constraints]]
type = "maximum_absolute_mass_flow"
limit = 0.08
unit = "kg/s"

[[constraints]]
type = "valid_thermodynamic_model"
unit = "1"

[screening]
samples = 1440
maximum_large_enclosed_volume_m3 = 0.066

[search]
type = "sobol"
seed = 28092026
scramble = true
domain = "fixed_global_bounds"

[numerical]
maximum_cycles = 100
backend = "numba"
candidate_budget_seconds = 180.0
domain_error_retry = "once_safe_uniform_state_with_source_wall_temperatures"

[warm_start]
initial_source = "uniform"

[execution]
default_budget = "30m"
default_max_candidates = 16
initial_evaluation_seconds = 30.0
deadline_grace_seconds = 5.0
