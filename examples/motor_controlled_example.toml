# CONTROLLED MOTOR EXAMPLE ONLY. See docs/MOTOR_OPERATION.md.
# This is a numerically verified first-level model result, not a validated design.

[metadata]
example_data = true
description = "Reversed ideal-piecewise motor cycle; illustrative dry ideal gas"

[working_gas]
gas_constant = 287.0
heat_capacity_cp = 1004.5
heat_capacity_cv = 717.5

[reservoirs]
cold_temperature = 300.0
hot_temperature = 600.0

[operation]
angular_speed = -0.9520107557799403     # rad/s; reverse geometry and swap reservoirs

[charge]
pressure = 100000.0
temperature = 298.15

[geometry]
# Swept-volume ratio S/L = 0.84 with one-percent clearances.
small_cylinder_minimum_volume = 0.0002772
small_cylinder_maximum_volume = 0.0279972
large_cylinder_minimum_volume = 0.00033
large_cylinder_maximum_volume = 0.03333
cold_heat_exchanger_volume = 0.00066
hot_heat_exchanger_volume = 0.00066

[heat_transfer]
cold_ua = 125.0
hot_ua = 125.0

[hydraulics]
# Explicit numerical regularization; convergence is checked separately.
orifice_pressure_regularization = 0.03
large_to_hot_cda = 0.00042
small_to_cold_cda = 0.00075
hot_to_small_valve_cda = 0.00042
cold_to_large_valve_cda = 0.00150

[valves]
model = "continuous_ideal_diode"

[valves.hot_to_small]
opening_pressure_difference = 0.0
closing_pressure_difference = 0.0

[valves.cold_to_large]
opening_pressure_difference = 0.0
closing_pressure_difference = 0.0

[kinematics]
type = "ideal_piecewise_linear"
small_lambda_target = 0.49
large_lambda_target = 0.44
adiabatic_sector_fraction = 0.15

[validity]
maximum_pressure_equalization_error = 0.05
maximum_mach_number = 0.2
maximum_isothermality_error = 0.05
maximum_compressibility_deviation = 0.01
maximum_cp_variation = 0.01

[numerical]
integration_method = "LSODA"
integration_relative_tolerance = 1.0e-8
integration_absolute_tolerance = 1.0e-10
maximum_step_angle_degrees = 0.5
maximum_valve_events_per_cycle = 100
maximum_cycles = 100
periodic_relative_tolerance = 1.0e-7
periodic_mass_absolute_tolerance = 1.0e-12
periodic_energy_absolute_tolerance = 1.0e-6
