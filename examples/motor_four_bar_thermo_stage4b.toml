# Stage-4b local thermodynamic exploration.
# Mechanical geometry fixed at the Stage-3 champion.
# Search narrowed around the known 48.54 W / 15.69 % operating point.

[campaign]
base_configuration = "motor_demonstrator_stage3_champion_325c.toml"
hardware_configuration = "motor_hardware_parallel_325c.toml"
maximum_candidates = 192
elite_size = 16
initial_evaluation_seconds = 30.0
deadline_grace_seconds = 3.0

[families]
kinematics = "four_bar"
exchanger = "microtube"

[search]
type = "sobol"
seed = 307
scramble = true

[wall_numerical]
integration_method = "LSODA"
integration_relative_tolerance = 1.0e-8
integration_absolute_tolerances = [
  1.0e-13, 1.0e-8,
  1.0e-13, 1.0e-8,
  1.0e-13, 1.0e-8,
  1.0e-13, 1.0e-8,
  1.0e-7, 1.0e-7,
  1.0e-8, 1.0e-8, 1.0e-8, 1.0e-8, 1.0e-8
]
maximum_step_angle_radians = 0.008726646259971648
periodic_relative_tolerance = 1.0e-6
periodic_absolute_tolerance = 1.0e-12
progress_interval_seconds = 1.0
accelerate_walls = true

[objective]
type = "maximize_thermal_efficiency"

[[constraints]]
type = "minimum_motor_power"
required_power = 40.0

[[constraints]]
type = "maximum_pressure"
limit = 1200000.0

[[constraints]]
type = "maximum_temperature"
limit = 850.0

[[constraints]]
type = "maximum_absolute_mass_flow"
limit = 0.08

[[constraints]]
type = "valid_thermodynamic_model"

# Cylinder volumes.
# Bounds still allow S/L ratios from about 0.39 to 1.92.

[[parameters]]
name = "common.small_swept_volume"
lower = 0.00055
upper = 0.00125
initial = 0.0008316831683168317
transform = "log"

[[parameters]]
name = "common.large_swept_volume"
lower = 0.00065
upper = 0.00140
initial = 0.0009900990099009901
transform = "log"

# Dead volumes.

[[parameters]]
name = "common.small_clearance_ratio"
lower = 0.005
upper = 0.020
initial = 0.010
transform = "log"

[[parameters]]
name = "common.large_clearance_ratio"
lower = 0.005
upper = 0.020
initial = 0.010
transform = "log"

# Charge.

[[parameters]]
name = "common.charge_pressure"
lower = 80000.0
upper = 200000.0
initial = 100000.0
transform = "log"

# Stage 4 suggests the interesting region remains at low frequency.

[[parameters]]
name = "operation.frequency_hz"
lower = 2.0
upper = 3.5
initial = 2.0
transform = "linear"

# Exchanger lengths remain independent.
# Bounds retain both the short-exchanger and high-power solutions seen in Stage 4.

[[parameters]]
name = "microtube.heat_in.tube_length_m"
lower = 0.020
upper = 0.075
initial = 0.042333333333333334
transform = "log"

[[parameters]]
name = "microtube.heat_out.tube_length_m"
lower = 0.020
upper = 0.075
initial = 0.042333333333333334
transform = "log"
