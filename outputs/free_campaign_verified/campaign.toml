# Small machinery smoke campaign, not a final optimization or optimal waveform.
[campaign]
base_configuration = "motor_demonstrator_original_325c.toml"
maximum_candidates = 2
elite_size = 5
initial_evaluation_seconds = 10.0

[numerical]
# Smoke-runtime cap only. Periodic tolerances are unchanged; non-convergence
# remains a rejection, never a provisional feasible result.
maximum_cycles = 6

[families]
kinematics = "free"
exchanger = "reservoir"

[search]
type = "sobol"
seed = 27
scramble = true

[free]
# Four chart coordinates per cylinder; only two per side vary in this smoke.
# The initial spline is sampled from the seed; the free family imposes no such shape.
small_coordinates = [0.022919624003035495, -0.17442834822639194, -0.4529962920228473, -0.5818216600557268]
large_coordinates = [0.16928123471700227, 0.45423274155894733, 0.5776297313179263, 0.4629521414489773]

[objective]
type = "maximize_thermal_efficiency"

[[constraints]]
type = "minimum_motor_power"
required_power = 1.0

[[constraints]]
type = "maximum_pressure"
limit = 600000.0

[[constraints]]
type = "maximum_temperature"
limit = 850.0

[[parameters]]
name = "free.small.0"
lower = -0.0020803759969645064
upper = 0.047919624003035496
initial = 0.022919624003035495
transform = "linear"

