# Pedal Cell Retro — long/thin exchanger experiment from DD7 candidate f013861305dd.
# Intent: keep 5 L / 2.8 Hz, reduce tube count by ~100x, recover heat-transfer
# area with much longer tubes, use circular triangular bundles + conical collectors,
# and allow only a modest thermodynamic/kinematic readaptation.

"mechanical_constraints" = []
"schema_version" = 3

[ "charge_reference" ]
"pressure_pa" = 100000.0
"temperature_k" = 298.15
"volume_state" = "maximum_total_gas_volume"

[[ "constraints" ]]
"type" = "valid_thermodynamic_model"
"unit" = "1"

[ "kinematics" ]
"coupling" = "independent"

[ "kinematics"."large" ]
"family" = "hybrid_compact"

[ "kinematics"."small" ]
"family" = "hybrid_compact"

[ "numerical" ]
"backend" = "numba"
"candidate_budget_seconds" = 300.0
"domain_error_retry" = "once_safe_uniform_state_with_source_wall_temperatures"
"maximum_cycles" = 100

[ "objective" ]
"type" = "maximize_cooling_cop"
"unit" = "1"

