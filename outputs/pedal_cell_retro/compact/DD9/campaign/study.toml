# --- Heat-in exchanger ---
# f013: 68,517 tubes -> 685 tubes (~100x fewer).
# Initial L=250.66 mm with Di=1.0 mm preserves approximately f013's
# internal gas-side heat-transfer area while making the bundle long and narrow.
[[ "parameters" ]]
"name" = "microtube.heat_in.tube_count"
"unit" = "1"
"value" = 685

[[ "parameters" ]]
"name" = "microtube.heat_in.tube_length_m"
"unit" = "m"
"initial" = 0.2506605762022566
"lower" = 0.15
"upper" = 0.50
"kind" = "continuous"
"transform" = "log"

[[ "parameters" ]]
"name" = "microtube.heat_in.inner_diameter_m"
"unit" = "m"
"initial" = 0.001
"lower" = 0.0008
"upper" = 0.0018
"kind" = "continuous"
"transform" = "log"

# 0.10 mm metal wall: intentionally more buildable than the previous 20 um wall.
[[ "parameters" ]]
"name" = "microtube.heat_in.wall_thickness_m"
"unit" = "m"
"value" = 0.0001

[[ "parameters" ]]
"name" = "microtube.heat_in.pitch_ratio"
"unit" = "1"
"value" = 1.25

# Declaring this selects circular_triangular_frustum_v1.
[[ "parameters" ]]
"name" = "microtube.heat_in.collector_half_angle_deg"
"unit" = "deg"
"value" = 30.0

[[ "parameters" ]]
"name" = "microtube.heat_in.conduit_area_ratio"
"unit" = "1"
"value" = 1.0

[[ "parameters" ]]
"name" = "microtube.heat_in.additional_internal_volume_m3"
"unit" = "m^3"
"value" = 0.0

