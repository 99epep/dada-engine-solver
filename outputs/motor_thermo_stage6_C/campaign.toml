# Stage 6: thermodynamic re-optimization
# Mechanical geometry C frozen.
# All branches use identical thermodynamic bounds and Sobol sequence.

[campaign]
base_configuration = "motor_demonstrator_stage3_champion_325c.toml"
hardware_configuration = "motor_hardware_parallel_325c.toml"
maximum_candidates = 128
elite_size = 16
initial_evaluation_seconds = 35.0
deadline_grace_seconds = 3.0

[families]
kinematics = "four_bar"
exchanger = "microtube"

[search]
type = "sobol"
seed = 701
scramble = true

[wall_numerical]
integration_method = "LSODA"
integration_relative_tolerance = 1.0e-8
integration_absolute_tolerances = [
  1.0e-13, 1.0e-8,
  1.0e-13, 1.0e-8,
  1.0e-13, 1.0e-8,
  1.0e-13, 1.0e-8,
  1.0e-7, 1.0e-7,
  1.0e-8, 1.0e-8, 1.0e-8, 1.0e-8, 1.0e-8
]
maximum_step_angle_radians = 0.008726646259971648
periodic_relative_tolerance = 1.0e-6
periodic_absolute_tolerance = 1.0e-12
progress_interval_seconds = 1.0
accelerate_walls = true

[objective]
type = "maximize_thermal_efficiency"

[[constraints]]
type = "minimum_motor_power"
required_power = 30.0

[[constraints]]
type = "maximum_pressure"
limit = 1200000.0

[[constraints]]
type = "maximum_temperature"
limit = 850.0

[[constraints]]
type = "maximum_absolute_mass_flow"
limit = 0.08

[[constraints]]
type = "valid_thermodynamic_model"

[fixed_parameters]
"four_bar.crank_ratio" = 0.38164709590375423
"four_bar.large_coupler_ratio" = 1.0483166928216816
"four_bar.large_output_along_ratio" = 0.4803802367672324
"four_bar.large_output_normal_ratio" = 1.0709787432849407
"four_bar.large_rocker_ratio" = 0.96385062716901304
"four_bar.small_coupler_ratio" = 0.96323056129738693
"four_bar.small_output_along_ratio" = 0.66114536058157691
"four_bar.small_output_normal_ratio" = -0.73662743836641309
"four_bar.small_rocker_ratio" = 1.0093855681642889

