schema_version = 1

description = """
Four retained paired six-bar mechanism lineages. Each family contains an
independently adapted SMALL and LARGE mechanism. Absolute lengths are normalized
by crank radius. The identifiers describe lineage and mechanical character,
not optimizer rank.
"""

length_unit = "crank_radius"
angle_unit = "rad"

family_order = [
    "compact_balanced",
    "compact_offset",
    "long_ground",
    "long_coupler_short_rocker",
]


[families.compact_balanced]
description = """
Compact lineage with relatively balanced primary-link proportions. Its final
LARGE mechanism approaches the retained H-lateral-span design limit.
"""
